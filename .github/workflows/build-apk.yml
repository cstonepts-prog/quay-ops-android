name: Build Code Dump Tool APK

on:
  push:
    branches:
      - codedump-apk-build-25082026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Code Dump Tool source
        shell: bash
        run: |
          set -euo pipefail
          BUILD_B64=/tmp/cdt-build.b64
          BUILD_XZ=/tmp/cdt-build.tar.xz
          BUILD_DIR=/tmp/cdt-build
          head -c 9000 .codedump2/part00.b64 > "$BUILD_B64"
          for i in $(seq -w 1 13); do
            cat ".codedump2/part${i}.b64" >> "$BUILD_B64"
          done
          test "$(wc -c < "$BUILD_B64")" -eq 123384
          base64 --decode "$BUILD_B64" > "$BUILD_XZ"
          echo "02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16  $BUILD_XZ" | sha256sum -c -
          mkdir -p "$BUILD_DIR"
          tar -xJf "$BUILD_XZ" -C "$BUILD_DIR"
          test -f "$BUILD_DIR/package.json"
          test -f "$BUILD_DIR/capacitor.config.json"
          test -f "$BUILD_DIR/scripts/prepare-android.mjs"
          test -f "$BUILD_DIR/native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt"
          test -f "$BUILD_DIR/web/index.html"
          echo "Source reconstruction and SHA-256 verification: PASS"

      - name: Apply audited Capacitor compile fix
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/.codedump2/capacitor-reject-throwable-fix.patch"
          echo "f64d5d3ecc37e71ae2db9d89e17eceb479d1d2ccebd4a3ef3d4f0a8b502e1608  $PATCH" | sha256sum -c -
          cd /tmp/cdt-build
          patch --batch -p1 < "$PATCH"
          grep -q 'private fun rejectionException(t: Throwable): Exception' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          echo "Audited compile patch: PASS"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK API 36 and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate lockfile and install pinned Capacitor dependencies reproducibly
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npm ls @capacitor/core @capacitor/android @capacitor/cli
          sha256sum package-lock.json

      - name: Generate Capacitor Android project
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          npm run android:prepare
          test -x android/gradlew || chmod +x android/gradlew
          test -f android/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          test -f android/app/src/main/AndroidManifest.xml

      - name: Verify Gradle runtime
        working-directory: /tmp/cdt-build/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Compile, test and lint Android app
        id: gradle_gate
        working-directory: /tmp/cdt-build/android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug > /tmp/gradle-build.log 2>&1
          rc=$?
          echo "gradle_exit_code=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '--- FILTERED GRADLE ROOT CAUSE ---'
            grep -E -n '(^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|Unresolved reference|Compilation error|Android resource linking failed|Manifest merger failed)' /tmp/gradle-build.log | tail -n 120 || true
            echo '--- GRADLE LOG TAIL ---'
            tail -n 160 /tmp/gradle-build.log || true
          fi
          exit "$rc"

      - name: Upload Gradle diagnostic log on failure
        if: failure() && steps.gradle_gate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: code-dump-tool-gradle-diagnostics-${{ github.run_number }}
          path: /tmp/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Stage APK and integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=/tmp/cdt-build/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" artifacts/code-dump-tool-debug.apk
          cp /tmp/cdt-build/package-lock.json artifacts/package-lock.json
          sha256sum artifacts/code-dump-tool-debug.apk artifacts/package-lock.json | tee artifacts/SHA256SUMS.txt
          printf 'baseline_source_sha256=%s\ncompile_patch_sha256=%s\ncommit=%s\nrun=%s\n' \
            '02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16' \
            'f64d5d3ecc37e71ae2db9d89e17eceb479d1d2ccebd4a3ef3d4f0a8b502e1608' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/BUILD_EVIDENCE.txt
          if test -f /tmp/cdt-build/android/app/build/reports/lint-results-debug.html; then
            cp /tmp/cdt-build/android/app/build/reports/lint-results-debug.html artifacts/lint-results-debug.html
          fi

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-dump-tool-apk-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
