name: Code Dump Tool EXEC002 R5 Android Build

on:
  push:
    branches:
      - codedump-exec002-r5-build-25082026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-exec002-r5-build
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconstruct and verify Code Dump Tool source
        shell: bash
        run: |
          set -euo pipefail
          BUILD_B64=/tmp/cdt-build.b64
          BUILD_XZ=/tmp/cdt-build.tar.xz
          BUILD_DIR=/tmp/cdt-build
          head -c 9000 .codedump2/part00.b64 > "$BUILD_B64"
          for i in $(seq -w 1 13); do
            cat ".codedump2/part${i}.b64" >> "$BUILD_B64"
          done
          test "$(wc -c < "$BUILD_B64")" -eq 123384
          base64 --decode "$BUILD_B64" > "$BUILD_XZ"
          echo "02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16  $BUILD_XZ" | sha256sum -c -
          mkdir -p "$BUILD_DIR"
          tar -xJf "$BUILD_XZ" -C "$BUILD_DIR"
          test -f "$BUILD_DIR/package.json"
          test -f "$BUILD_DIR/capacitor.config.json"
          test -f "$BUILD_DIR/scripts/prepare-android.mjs"
          test -f "$BUILD_DIR/native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt"
          test -f "$BUILD_DIR/web/index.html"
          echo "Source reconstruction and SHA-256 verification: PASS"

      - name: Apply audited Android fixes
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/.codedump2/capacitor-reject-throwable-fix.patch"
          echo "07a1266095df13ee0016c00b895a77b70d362af6642540f9dcc54107b5852fba  $PATCH" | sha256sum -c -
          cd /tmp/cdt-build
          patch --batch -p1 < "$PATCH"
          grep -q 'private fun rejectionException(t: Throwable): Exception' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          ! grep -q 'takePersistableUriPermission(uri, take)' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          echo "Audited Android patch: PASS"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate and verify dependency lock
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo "60844314cd4a6da894912049390740425baf80d31766c12b2bc559f4e5d5651c  package-lock.json" | sha256sum -c -
          npm ci --no-audit --no-fund
          npm ls @capacitor/core @capacitor/android @capacitor/cli

      - name: Verify packaged source invariants
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8'))"
          for f in web/app.js web/core.js web/platform.js web/archive-core.js scripts/prepare-android.mjs; do
            test -s "$f"
            node --check "$f"
          done
          test -s native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          grep -q 'private fun rejectionException(t: Throwable): Exception' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          if test -f tests/android_conversion_static.test.js; then
            node tests/android_conversion_static.test.js
          fi
          if test -f web/tests/core.test.js; then
            npm test
          else
            echo 'Historical build transport omits web/tests; full EXEC002 R5 repository regression is executed separately.'
          fi
          echo 'Packaged source invariant verification: PASS'

      - name: Generate Capacitor Android project
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          npm run android:prepare
          test -x android/gradlew || chmod +x android/gradlew
          test -f android/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          test -f android/app/src/main/AndroidManifest.xml

      - name: Compile test lint and package Android outputs
        id: gradle_gate
        working-directory: /tmp/cdt-build/android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleRelease \
            bundleRelease > /tmp/gradle-build.log 2>&1
          rc=$?
          echo "gradle_exit_code=$rc"
          if [ "$rc" -ne 0 ]; then
            echo '--- FILTERED GRADLE ROOT CAUSE ---'
            grep -E -n '(^e: |error:|Error:|FAILURE:|What went wrong|Execution failed|Caused by:|Unresolved reference|Compilation error|Android resource linking failed|Manifest merger failed|Lint found|Signing)' /tmp/gradle-build.log | tail -n 180 || true
            echo '--- GRADLE LOG TAIL ---'
            tail -n 220 /tmp/gradle-build.log || true
          fi
          exit "$rc"

      - name: Upload Gradle diagnostics on failure
        if: failure() && steps.gradle_gate.conclusion == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-dump-tool-exec002-r5-gradle-failure-${{ github.run_number }}
          path: /tmp/gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Stage APK AAB and integrity evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/cdt-build/android/app/build/outputs/apk/debug/app-debug.apk artifacts/code-dump-tool-exec002-r5-debug.apk
          find /tmp/cdt-build/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} artifacts/ \;
          find /tmp/cdt-build/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -exec cp {} artifacts/ \;
          cp /tmp/cdt-build/package-lock.json artifacts/package-lock.json
          if test -f /tmp/cdt-build/android/app/build/reports/lint-results-debug.html; then
            cp /tmp/cdt-build/android/app/build/reports/lint-results-debug.html artifacts/
          fi
          (cd artifacts && sha256sum *.apk *.aab package-lock.json 2>/dev/null | sort > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt
          printf 'baseline_source_sha256=%s\nandroid_patch_sha256=%s\npackage_lock_sha256=%s\ncheckout=%s\nsetup_node=%s\nsetup_java=%s\nsetup_android=%s\nsetup_gradle=%s\nupload_artifact=%s\ncommit=%s\nrun=%s\n' \
            '02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16' \
            '07a1266095df13ee0016c00b895a77b70d362af6642540f9dcc54107b5852fba' \
            '60844314cd4a6da894912049390740425baf80d31766c12b2bc559f4e5d5651c' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' \
            'actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961' \
            'android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699' \
            'gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > artifacts/BUILD_EVIDENCE.txt

      - name: Upload verified Android artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-dump-tool-exec002-r5-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
