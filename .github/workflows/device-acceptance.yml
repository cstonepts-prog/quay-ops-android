name: Code Dump Tool R5 Android Emulator Acceptance

on:
  push:
    branches:
      - codedump-r5-device-acceptance-25082026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codedump-r5-device-acceptance
  cancel-in-progress: true

env:
  CI: true

jobs:
  emulator-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated acceptance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconstruct and verify Code Dump Tool source
        shell: bash
        run: |
          set -euo pipefail
          BUILD_B64=/tmp/cdt-build.b64
          BUILD_XZ=/tmp/cdt-build.tar.xz
          BUILD_DIR=/tmp/cdt-build
          head -c 9000 .codedump2/part00.b64 > "$BUILD_B64"
          for i in $(seq -w 1 13); do cat ".codedump2/part${i}.b64" >> "$BUILD_B64"; done
          test "$(wc -c < "$BUILD_B64")" -eq 123384
          base64 --decode "$BUILD_B64" > "$BUILD_XZ"
          echo "02fe87bea2103f93571a52ec6936efe0153cb2fa47597229699f1af074ac5b16  $BUILD_XZ" | sha256sum -c -
          mkdir -p "$BUILD_DIR"
          tar -xJf "$BUILD_XZ" -C "$BUILD_DIR"
          test -f "$BUILD_DIR/package.json"

      - name: Apply audited Android fixes
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/.codedump2/capacitor-reject-throwable-fix.patch"
          BACK_PATCH="$GITHUB_WORKSPACE/.codedump2/android-back-fix.patch"
          echo "07a1266095df13ee0016c00b895a77b70d362af6642540f9dcc54107b5852fba  $PATCH" | sha256sum -c -
          echo "7b6d4a315e3e33f822fbb36024ac100d5101d1043a667d3f3e50f42a03765653  $BACK_PATCH" | sha256sum -c -
          cd /tmp/cdt-build
          patch --batch -p1 < "$PATCH"
          patch --batch -p1 < "$BACK_PATCH"
          grep -q 'private fun rejectionException(t: Throwable): Exception' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          ! grep -q 'takePersistableUriPermission(uri, take)' native/android-overlay/app/src/main/java/app/codedump/tool/CodeDumpNativePlugin.kt
          grep -q 'OnBackPressedCallback' native/android-overlay/app/src/main/java/app/codedump/tool/MainActivity.kt
          grep -q '__codeDumpHandleAndroidBack' web/app.js

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install locked dependencies and prepare debug APK
        working-directory: /tmp/cdt-build
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "60844314cd4a6da894912049390740425baf80d31766c12b2bc559f4e5d5651c  package-lock.json" | sha256sum -c -
          npm ci --no-audit --no-fund
          npm run android:prepare
          test -x android/gradlew || chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM permissions
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi

      - name: Run Android 16 emulator acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash .codedump2/device-acceptance.sh

      - name: Upload device acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-dump-tool-r5-device-acceptance-${{ github.run_number }}
          path: device-evidence/
          if-no-files-found: warn
          retention-days: 30
