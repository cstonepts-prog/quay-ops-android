<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0c0d0e"/>
<title>Quay</title>
<style>
:root{
  --bg:#0c0d0e;--panel:#141618;--panel2:#1a1d20;--border:#25282c;
  --text:#e8eaed;--muted:#8b9198;--accent:#b7c4ce;
  --ok:#6bcf7f;--warn:#e6b35a;--err:#e06c75;--live:#5b9fd4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
.brand{font-weight:700;letter-spacing:.06em;color:var(--accent);font-size:15px}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 11px;border-radius:6px;cursor:pointer;font:inherit;white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--border);background:var(--panel2)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);
  color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.badge.live{color:var(--live);border-color:#2a4a66}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;
  max-width:720px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-bottom:12px}
.card h3{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--live);transition:width .3s linear}
.btn{background:var(--accent);color:var(--bg);border:none;padding:10px 16px;
  border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn.block{width:100%}
.muted{color:var(--muted)}
.st-transferring{color:var(--live)}.st-waiting{color:var(--warn)}
.st-completed{color:var(--ok)}.st-failed{color:var(--err)}.st-paused{color:var(--muted)}
.wizard{max-width:400px;margin:32px auto;padding:24px;background:var(--panel);
  border:1px solid var(--border);border-radius:12px}
.wizard h1{font-size:24px;margin-bottom:4px;letter-spacing:.04em}
.wizard .sub{color:var(--muted);margin-bottom:18px;line-height:1.5}
.wizard .actions{display:flex;gap:8px;margin-top:22px}
.probe{font-size:12px;color:var(--muted);margin:5px 0;padding-left:2px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);
  color:var(--text);padding:9px 11px;border-radius:6px;font:inherit}
.choice{display:flex;gap:8px;margin:10px 0}
.choice label{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;
  cursor:pointer;background:var(--panel2);text-align:center}
.choice label.on{border-color:var(--accent);background:#1e2226}
.choice input{display:none}
.stat{display:flex;gap:12px;margin-bottom:12px}
.stat .box{flex:1;background:var(--panel2);border-radius:8px;padding:12px;text-align:center;
  border:1px solid var(--border)}
.stat .n{font-size:22px;font-weight:700;color:var(--accent)}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

var INSTALL_KEY="quay-install-v1";
var STORAGE="quay-state-v1";
var MB=1024*1024;

function isInstalled(){
  try{var d=JSON.parse(localStorage.getItem(INSTALL_KEY)||"null");return !!(d&&d.completedAt);}catch(e){return false;}
}
function markInstalled(meta){
  localStorage.setItem(INSTALL_KEY,JSON.stringify(Object.assign({completedAt:Date.now(),version:1},meta||{})));
}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE));}catch(e){return null;}}
function saveState(s){try{localStorage.setItem(STORAGE,JSON.stringify(s));}catch(e){}}

function fmtBytes(b){
  if(!isFinite(b)||b<0)return "—";
  if(b<1024)return Math.round(b)+" B";
  var u=["KB","MB","GB","TB"],n=b/1024,i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return n.toFixed(n>=100||i===0?0:1)+" "+u[i];
}
function fmtSpeed(bps){if(!bps||bps<1)return "0 B/s";return fmtBytes(bps)+"/s";}
function fmtWhen(ts){
  if(!ts)return "—";
  var now=Date.now(),d=ts-now;
  if(Math.abs(d)<8000)return "now";
  if(ts<now){var s=Math.round((now-ts)/1000);if(s<60)return s+"s ago";var m=Math.round(s/60);if(m<60)return m+"m ago";return Math.round(m/60)+"h ago";}
  if(d<60000)return "in <1m";
  var mins=Math.round(d/60000);
  if(mins<60)return "in "+mins+"m";
  return "in "+Math.round(mins/60)+"h";
}

function probeEnv(){
  var cores=navigator.hardwareConcurrency||4;
  var mem=navigator.deviceMemory;
  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  var downlink=conn&&conn.downlink;
  var saveData=!!(conn&&conn.saveData);
  var touch=(navigator.maxTouchPoints||0)>0;
  var concurrency=Math.max(1,Math.min(6,Math.round(cores/2)));
  if(mem&&mem<=4)concurrency=Math.min(concurrency,2);
  if(touch)concurrency=Math.min(concurrency,3);
  var bandwidth=8;
  if(typeof downlink==="number"&&downlink>0)bandwidth=Math.max(1,Math.min(32,Math.round(downlink/8)));
  if(saveData)bandwidth=Math.min(bandwidth,2);
  var notes=[];
  notes.push(cores+" CPU threads");
  if(mem)notes.push("~"+mem+" GB memory");
  if(typeof downlink==="number")notes.push("~"+downlink+" Mbps link");
  if(touch)notes.push("Touch device · compact defaults");
  if(window.__QUAY_ANDROID__)notes.push("Android · background service armed");
  return {cores:cores,mem:mem,concurrency:concurrency,bandwidth:bandwidth,notes:notes};
}

function seedDemo(settings){
  var now=Date.now();
  return {
    sites:[
      {id:"s1",name:"Romford backup",host:"ftp.romford.ops",protocol:"sftp",port:22,connected:true,note:"Nightly vault"},
      {id:"s2",name:"London archive",host:"ftp.archives.london",protocol:"ftps",port:990,connected:true,note:"Masters"},
      {id:"s3",name:"Studio prod",host:"assets.studio.prod",protocol:"ftp",port:21,connected:true,note:"Working files"},
      {id:"s4",name:"CDN origin",host:"origin.cdn.eu",protocol:"sftp",port:22,connected:false,note:"Edge ingest"}
    ],
    jobs:[
      {id:"j1",fileName:"invoice-batch.zip",status:"transferring",sizeBytes:18*MB,transferred:11*MB,speedBps:3.2*MB,siteId:"s1",direction:"upload"},
      {id:"j2",fileName:"grade-v3.mov",status:"transferring",sizeBytes:210*MB,transferred:42*MB,speedBps:4.1*MB,siteId:"s3",direction:"download"},
      {id:"j3",fileName:"podcast-ep12.wav",status:"waiting",sizeBytes:86*MB,transferred:0,speedBps:0,siteId:"s2",direction:"upload"},
      {id:"j4",fileName:"hero-still.tiff",status:"waiting",sizeBytes:48*MB,transferred:0,speedBps:0,siteId:"s2",direction:"upload"},
      {id:"j5",fileName:"weekly-report.xlsx",status:"waiting",sizeBytes:2.4*MB,transferred:0,speedBps:0,siteId:"s1",direction:"upload"},
      {id:"j6",fileName:"ledger-q3.csv",status:"completed",sizeBytes:890*1024,transferred:890*1024,speedBps:0,siteId:"s1",direction:"upload"},
      {id:"j7",fileName:"contact-sheet.jpg",status:"completed",sizeBytes:4.2*MB,transferred:4.2*MB,speedBps:0,siteId:"s2",direction:"download"},
      {id:"j8",fileName:"app.bundle.js",status:"failed",sizeBytes:1.8*MB,transferred:0.4*MB,speedBps:0,siteId:"s4",direction:"upload",error:"Connection refused"}
    ],
    schedules:[
      {id:"sc1",name:"Nightly backup",enabled:true,nextRunAt:now+6*3600000,site:"Romford backup"},
      {id:"sc2",name:"Log shipper",enabled:true,nextRunAt:now+120000,site:"Romford backup"},
      {id:"sc3",name:"Sunday archive",enabled:true,nextRunAt:now+2*24*3600000,site:"London archive"}
    ],
    settings:Object.assign({concurrency:3,bandwidthMBps:8},settings||{}),
    logs:[{id:"l1",at:now,level:"ok",message:"Quay ready · demo fleet loaded"}],
    view:"board"
  };
}

function seedClean(settings){
  return {
    sites:[],jobs:[],schedules:[],
    settings:Object.assign({concurrency:3,bandwidthMBps:8},settings||{}),
    logs:[{id:"l1",at:Date.now(),level:"ok",message:"Quay installed · clean workspace"}],
    view:"board"
  };
}

var state=null;
var wizard=null;
var tickTimer=null;
var STEPS=["welcome","mode","capacity","review"];

function siteName(id){
  if(!state||!state.sites)return id||"—";
  for(var i=0;i<state.sites.length;i++)if(state.sites[i].id===id)return state.sites[i].name;
  return id||"—";
}
function liveCount(){return (state&&state.jobs?state.jobs:[]).filter(function(j){return j.status==="transferring";}).length;}
function waitCount(){return (state&&state.jobs?state.jobs:[]).filter(function(j){return j.status==="waiting";}).length;}

window.__quayStatus=function(){return JSON.stringify({live:liveCount(),wait:waitCount()});};

function tick(){
  if(!state||!state.jobs)return;
  var changed=false;
  var conc=state.settings.concurrency||3;
  var live=state.jobs.filter(function(j){return j.status==="transferring";});
  while(live.length<conc){
    var next=null;
    for(var i=0;i<state.jobs.length;i++)if(state.jobs[i].status==="waiting"){next=state.jobs[i];break;}
    if(!next)break;
    next.status="transferring";
    next.speedBps=2.5*MB;
    live.push(next);
    changed=true;
  }
  for(var i=0;i<state.jobs.length;i++){
    var j=state.jobs[i];
    if(j.status!=="transferring")continue;
    var step=(j.speedBps||1e6)*0.45;
    j.transferred=Math.min(j.sizeBytes,j.transferred+step);
    if(j.transferred>=j.sizeBytes){j.status="completed";j.speedBps=0;j.transferred=j.sizeBytes;}
    changed=true;
  }
  if(changed){saveState(state);window.__QUAY_STATE=state;renderApp();}
}

function jobRow(j){
  var pct=j.sizeBytes?Math.round((j.transferred/j.sizeBytes)*100):0;
  var bar=(j.status==="transferring"||j.status==="paused")?'<div class="bar"><i style="width:'+pct+'%"></i></div>':"";
  return '<div class="row" style="flex-direction:column;align-items:stretch">'+
    '<div style="display:flex;justify-content:space-between;gap:8px">'+
      '<strong style="word-break:break-all">'+j.fileName+'</strong>'+
      '<span class="st-'+j.status+'">'+j.status+'</span></div>'+
    '<div class="muted" style="font-size:12px">'+j.direction+' · '+siteName(j.siteId)+
      ' · '+fmtBytes(j.transferred)+' / '+fmtBytes(j.sizeBytes)+
      (j.speedBps?' · '+fmtSpeed(j.speedBps):'')+
      (j.error?' · '+j.error:'')+'</div>'+bar+'</div>';
}

function renderBoard(){
  var jobs=state.jobs||[];
  var live=jobs.filter(function(j){return j.status==="transferring";});
  var waiting=jobs.filter(function(j){return j.status==="waiting";});
  var done=jobs.filter(function(j){return j.status==="completed"||j.status==="failed"||j.status==="paused";});
  return '<div class="stat">'+
    '<div class="box"><div class="n">'+live.length+'</div><div class="l">Live</div></div>'+
    '<div class="box"><div class="n">'+waiting.length+'</div><div class="l">Queued</div></div>'+
    '<div class="box"><div class="n">'+(state.settings.concurrency||3)+'</div><div class="l">Berths</div></div></div>'+
    '<div class="card"><h3>Live berths</h3>'+(live.length?live.map(jobRow).join(""):'<div class="empty">No active transfers</div>')+'</div>'+
    '<div class="card"><h3>Queue</h3>'+(waiting.length?waiting.map(jobRow).join(""):'<div class="empty">Queue clear</div>')+'</div>'+
    '<div class="card"><h3>Recent</h3>'+(done.length?done.slice(0,6).map(jobRow).join(""):'<div class="empty">None yet</div>')+'</div>';
}

function renderSites(){
  var sites=state.sites||[];
  if(!sites.length)return '<div class="card"><div class="empty">No sites yet</div></div>';
  return '<div class="card"><h3>Fleet · '+sites.length+'</h3>'+sites.map(function(s){
    return '<div class="row"><div><strong>'+s.name+'</strong>'+
      '<div class="muted" style="font-size:12px">'+s.protocol+'://'+s.host+':'+(s.port||21)+
      (s.note?' · '+s.note:'')+'</div></div>'+
      '<span class="badge '+(s.connected?'live':'')+'">'+(s.connected?'online':'offline')+'</span></div>';
  }).join("")+'</div>';
}

function renderSchedules(){
  var sc=state.schedules||[];
  if(!sc.length)return '<div class="card"><div class="empty">No schedules</div></div>';
  return '<div class="card"><h3>Schedules</h3>'+sc.map(function(s){
    return '<div class="row"><div><strong>'+s.name+'</strong>'+
      '<div class="muted" style="font-size:12px">'+(s.site||'')+' · Next '+fmtWhen(s.nextRunAt)+'</div></div>'+
      '<span class="badge">'+(s.enabled?'armed':'off')+'</span></div>';
  }).join("")+'</div>';
}

function renderWizard(){
  var step=STEPS[wizard.step];
  var body="";
  if(step==="welcome"){
    body='<p class="sub">Industrial FTP operations console with queue, scheduling, and background transfers.</p>'+
      wizard.probe.notes.map(function(n){return '<div class="probe">· '+n+'</div>';}).join("");
  } else if(step==="mode"){
    body='<p class="sub">Load a demo fleet with live jobs, or start with an empty workspace.</p>'+
      '<div class="choice">'+
        '<label class="'+(wizard.mode==="demo"?"on":"")+'" data-mode="demo"><strong>Demo fleet</strong><div class="muted" style="font-size:12px;margin-top:4px">Sample sites & jobs</div></label>'+
        '<label class="'+(wizard.mode==="clean"?"on":"")+'" data-mode="clean"><strong>Clean</strong><div class="muted" style="font-size:12px;margin-top:4px">Empty workspace</div></label>'+
      '</div>';
  } else if(step==="capacity"){
    body='<p class="sub">Parallel transfer berths and bandwidth cap.</p>'+
      '<div class="field"><label>Berths · <span id="capVal">'+wizard.concurrency+'</span></label>'+
      '<input type="range" min="1" max="6" value="'+wizard.concurrency+'" id="cap"/></div>'+
      '<div class="field"><label>Bandwidth · <span id="bwVal">'+wizard.bandwidth+'</span> MB/s</label>'+
      '<input type="range" min="1" max="32" value="'+wizard.bandwidth+'" id="bw"/></div>';
  } else if(step==="review"){
    body='<p class="sub">Ready to launch.</p>'+
      '<div class="row"><span class="muted">Mode</span><strong>'+wizard.mode+'</strong></div>'+
      '<div class="row"><span class="muted">Berths</span><strong>'+wizard.concurrency+'</strong></div>'+
      '<div class="row"><span class="muted">Bandwidth</span><strong>'+wizard.bandwidth+' MB/s</strong></div>';
  }
  var titles={welcome:"Welcome",mode:"Install mode",capacity:"Transfer capacity",review:"Review"};
  document.getElementById("app").innerHTML=
    '<div class="wizard"><h1>QUAY</h1>'+
    '<p class="muted" style="margin-bottom:14px">Step '+(wizard.step+1)+' of '+STEPS.length+' · '+titles[step]+'</p>'+
    body+
    '<div class="actions">'+
      (wizard.step>0?'<button class="btn ghost" id="back">Back</button>':'')+
      '<button class="btn" id="next" style="flex:1">'+(step==="review"?"Launch Quay":"Continue")+'</button>'+
    '</div></div>';

  document.getElementById("back")&&document.getElementById("back").addEventListener("click",function(){
    wizard.step=Math.max(0,wizard.step-1);renderWizard();
  });
  document.getElementById("next").addEventListener("click",function(){
    if(step==="review"){finishInstall();return;}
    wizard.step=Math.min(STEPS.length-1,wizard.step+1);renderWizard();
  });
  var choice=document.querySelectorAll(".choice label");
  for(var i=0;i<choice.length;i++){
    choice[i].addEventListener("click",function(){
      wizard.mode=this.getAttribute("data-mode");renderWizard();
    });
  }
  var cap=document.getElementById("cap");
  if(cap)cap.addEventListener("input",function(){
    wizard.concurrency=Number(this.value);
    document.getElementById("capVal").textContent=wizard.concurrency;
  });
  var bw=document.getElementById("bw");
  if(bw)bw.addEventListener("input",function(){
    wizard.bandwidth=Number(this.value);
    document.getElementById("bwVal").textContent=wizard.bandwidth;
  });
}

function finishInstall(){
  markInstalled({mode:wizard.mode,concurrency:wizard.concurrency});
  var settings={concurrency:wizard.concurrency,bandwidthMBps:wizard.bandwidth};
  state=wizard.mode==="demo"?seedDemo(settings):seedClean(settings);
  saveState(state);
  window.__QUAY_STATE=state;
  try{if(window.QuayNative&&window.QuayNative.startBackground)window.QuayNative.startBackground();}catch(e){}
  startTick();
  renderApp();
}

function renderApp(){
  if(!isInstalled()||!state){
    if(!wizard){var p=probeEnv();wizard={step:0,mode:"demo",concurrency:p.concurrency,bandwidth:p.bandwidth,probe:p};}
    renderWizard();
    return;
  }
  var view=state.view||"board";
  var body=view==="sites"?renderSites():view==="schedules"?renderSchedules():renderBoard();
  document.getElementById("app").innerHTML=
    '<div class="topbar">'+
      '<div class="brand">QUAY</div>'+
      '<div class="tabs">'+
        '<button class="tab '+(view==="board"?"active":"")+'" data-v="board">Board</button>'+
        '<button class="tab '+(view==="sites"?"active":"")+'" data-v="sites">Fleet</button>'+
        '<button class="tab '+(view==="schedules"?"active":"")+'" data-v="schedules">Schedules</button>'+
      '</div>'+
      '<span class="badge live">'+liveCount()+' live</span>'+
    '</div><div class="main">'+body+'</div>';
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click",function(){
      state.view=this.getAttribute("data-v");saveState(state);renderApp();
    });
  }
}

function startTick(){
  if(tickTimer)clearInterval(tickTimer);
  tickTimer=setInterval(tick,500);
}

function boot(){
  document.documentElement.classList.add("quay-android");
  if(isInstalled()){
    state=loadState()||seedDemo();
    window.__QUAY_STATE=state;
    try{if(window.QuayNative&&window.QuayNative.startBackground)window.QuayNative.startBackground();}catch(e){}
    startTick();
  }
  renderApp();
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
</body>
</html>
